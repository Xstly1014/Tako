  responses:
    PreviewExpired:
      description: 未提交预览已过期，重新准备；不会删除草稿或已提交版本
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadInput: &errorResponse
      description: 输入格式、字段约束或验证码不正确；不透露账号是否存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OriginRejected:
      <<: *errorResponse
      description: 写请求来源不匹配
    TooLarge:
      <<: *errorResponse
      description: 请求超过 2 MiB；保留本机文字，禁止盲目重试
    NotJSON:
      <<: *errorResponse
      description: 写请求必须使用 application/json
    Limited:
      <<: *errorResponse
      description: 频率限制；Retry-After 是建议最短等待，小时额度可能尚未恢复
      headers:
        Retry-After: {schema: {type: string}, description: 建议等待秒数}
    Unavailable:
      <<: *errorResponse
      description: 服务或邮件暂不可用，request_id 用于排查；保存请求保留原幂等标识
    Unauthorized:
      <<: *errorResponse
      description: 会话缺失、过期或已撤销；前端保留本机草稿
    NotFound:
      <<: *errorResponse
      description: 草稿不存在或无权访问，统一语义
    Conflict:
      <<: *errorResponse
      description: revision_conflict、novel_revision_conflict（书籍资料已变化）、mutation_id_reused、delivery_id_reused 或 nickname_required；客户端分别处理，不循环重试

    InternalError:
      <<: *errorResponse
      description: 未预期内部错误，携带请求 ID，不能假设业务未提交

