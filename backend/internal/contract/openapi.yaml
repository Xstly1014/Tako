openapi: 3.0.3
info:
  title: Tako 创作 API
  version: 0.36.0
  description: |
    私有测试阶段。A 核心链路已验收，两项真机补测搁置。B1 发布与阅读受 PUBLICATION_ENABLED 开关控制，默认关闭；不代表完整 B 已交付。
    Cookie 会话由当前启用的登录方式建立，浏览器不得手动填写会话令牌。
    部署可通过 SESSION_COOKIE_NAME 隔离会话；运行时文档使用该环境实际 Cookie 名，默认 tako_session。API 返回 X-Tako-Environment 标识 local/test/production。
    浏览器写操作需同源 Origin；原生 App 使用专用 Bearer，不带 Origin/Cookie。所有写操作需 application/json。Swagger 通过 http://localhost:3000/docs/ 调试。
    验证码持久化入队，由独立 worker 处理；sent 仅表示邮件服务接受，不保证收件箱送达。
servers:
  - url: /
tags:
  - name: 身份
  - name: 草稿
  - name: 发布
  - name: 阅读
security:
  - session: []
  - appSession: []
paths:
  /api/ops/short-post-revisions:
    get:
      operationId: listShortPostRevisionQueue
      tags: [短内容]
      summary: 运营浏览待先审和待后审修订
      parameters:
        - in: query
          name: cursor
          schema: {type: string, maxLength: 73}
      responses:
        '200':
          description: 待处理修订列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostRevisionQueuePage'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts/{id}/revisions/{revisionId}/images/{imageId}:
    get:
      operationId: readShortPostRevisionReviewImage
      tags: [短内容]
      summary: 运营读取已提交修订的指定图片
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: revisionId
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: imageId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 已提交修订的固定图片
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/short-posts/{id}/versions:
    get:
      operationId: listShortPostVersions
      tags: [短内容]
      summary: 读取公开短帖版本节点
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: before
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: 读取公开短帖版本节点
          content:
            application/json:
              schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ShortPostVersionNode'}}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/short-posts/{id}/versions/{version}:
    get:
      operationId: readShortPostVersion
      tags: [短内容]
      summary: 读取指定公开版本
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: version
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: 读取指定公开版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicShortPost'}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-posts/{id}/versions/{version}:
    get:
      operationId: readMyShortPostVersion
      tags: [短内容]
      summary: 读取本人指定正式版本
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: version
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: 读取本人指定正式版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnedShortPostVersion'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-posts/{id}/revisions/{revisionId}:
    put:
      operationId: reviseShortPost
      tags: [短内容]
      summary: 用固定预览修订本人已正式发布的短帖
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: revisionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, rights_confirmed, expected_revision]
              properties:
                preview_id: {type: string, format: uuid}
                rights_confirmed: {type: boolean, enum: [true]}
                expected_revision: {type: integer, minimum: 1, maximum: 9007199254740990}
      responses:
        '200':
          description: 用固定预览修订本人已正式发布的短帖
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostSubmissionReceipt'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/PreviewExpired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: readMyShortPostRevision
      tags: [短内容]
      summary: 读取本人提交的修订快照和状态
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: revisionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 读取本人提交的修订快照和状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostRevisionSnapshot'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts/{id}/revisions/{revisionId}:
    get:
      operationId: readOpsShortPostRevision
      tags: [短内容]
      summary: 运营读取已提交的修订快照
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: revisionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 运营读取已提交的修订快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostRevisionSnapshot'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/short-posts:
    get:
      operationId: listShortPosts
      tags: [短内容]
      summary: 浏览短内容频道
      security: []
      description: 仅 test 环境。每页 12 条按首次公开时间倒序，隐藏和恢复不改变排序。
      parameters:
        - in: query
          name: cursor
          schema: {type: string, maxLength: 36}
      responses:
        '200':
          description: 浏览短内容频道
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostFeedPage'}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts:
    get:
      operationId: listShortPostReviewQueue
      tags: [短内容]
      summary: 运营查看待处理短帖
      description: 仅运营。每页 12 条，区分先审与后审。
      parameters:
        - in: query
          name: cursor
          schema: {type: string, maxLength: 36}
      responses:
        '200':
          description: 运营查看待处理短帖
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostReviewPage'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts/{id}/images/{imageId}:
    get:
      operationId: readShortPostReviewImage
      tags: [短内容]
      summary: 运营查看已提交版本图片
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: imageId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 运营查看已提交版本图片
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-posts/{id}:
    get:
      operationId: readMyShortPost
      tags: [短内容]
      summary: 作者查看固定提交与当前状态
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 作者查看固定提交与当前状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostManaged'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-posts/{id}/actions:
    post:
      operationId: changeMyShortPost
      tags: [短内容]
      summary: 作者处理短帖状态
      description: 作品存在平台限制时无法恢复公开。show_version 需要正式版本号。 同一账号、原请求 ID 与载荷重试返回原回执。
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mutation_id, expected_revision, action]
              properties:
                mutation_id: {type: string, format: uuid}
                expected_revision: {type: integer, minimum: 1, maximum: 9007199254740990}
                action: {type: string, enum: [hide, restore, history_open, history_close, show_version]}
                version: {type: integer, minimum: 1, maximum: 9007199254740991}
                reason: {type: string, maxLength: 500}
      responses:
        '200':
          description: 作者处理短帖状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostState'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts/{id}:
    get:
      operationId: readOpsShortPost
      tags: [短内容]
      summary: 运营查看固定提交与当前状态
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 运营查看固定提交与当前状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostManaged'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ops/short-posts/{id}/actions:
    post:
      operationId: changeOpsShortPost
      tags: [短内容]
      summary: 运营处理短帖状态
      description: 驳回、限制及撤销限制须填写原因。通过或驳回后续修订时填写 revision_id。限制或撤销指定正式版本时填写 version。 同一账号、原请求 ID 与载荷重试返回原回执。
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mutation_id, expected_revision, action]
              properties:
                mutation_id: {type: string, format: uuid}
                expected_revision: {type: integer, minimum: 1, maximum: 9007199254740990}
                action: {type: string, enum: [approve, reject, limit, revoke_limit, limit_version, revoke_version_limit]}
                version: {type: integer, minimum: 1, maximum: 9007199254740991}
                revision_id: {type: string, format: uuid}
                reason: {type: string, maxLength: 500}
      responses:
        '200':
          description: 运营处理短帖状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostState'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-post-submissions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: 同一次首发使用作者生成的非零 UUID
        schema: {type: string, format: uuid}
    put:
      operationId: submitShortPost
      tags: [短内容]
      summary: 确认固定短帖预览
      description: 仅 test 环境。按提交时的作者观察期分流，普通作者首发公开，观察期作者进入先审。预览仅可提交一次，原回执不会随审核状态改变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, rights_confirmed]
              properties:
                preview_id: {type: string, format: uuid}
                rights_confirmed: {type: boolean, enum: [true]}
      responses:
        '200':
          description: 原请求的首发回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostSubmissionReceipt'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 关联长文暂不可读、预览已使用、请求标识复用或缺笔名
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410': {$ref: '#/components/responses/PreviewExpired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: readMyShortPostSubmission
      tags: [短内容]
      summary: 读取本人原提交回执
      responses:
        '200':
          description: 固定首发回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostSubmissionReceipt'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/short-posts/{id}:
    get:
      operationId: readPublicShortPost
      tags: [短内容]
      security: []
      summary: 读取已公开短帖
      description: 仅 test 环境。关联书名来自当前公开长文，暂不可读时整个关联字段为空。
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 当前正式图文和关联
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicShortPost'}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/short-posts/{id}/versions/{version}/images/{imageId}:
    get:
      operationId: readPublicShortPostImage
      tags: [短内容]
      security: []
      summary: 读取短帖指定正式版本的图片
      description: 仅 test 环境。每次校验指定版本可读且图片确实属于该版，响应禁止缓存。
      parameters:
        - in: path
          name: version
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: imageId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 已发布的规范化图片
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-post-previews/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: 作者生成的非零预览 UUID，按登录账号隔离
        schema: {type: string, format: uuid}
    put:
      operationId: prepareShortPostPreview
      tags: [短内容]
      summary: 创建固定的本人短帖预览
      description: 本机 test 验证入口。预览包含固定正文、图片顺序和关联长文 ID，有效 24 小时。重试必须沿用相同 UUID 和内容。每个账号同时最多 32 份有效预览。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, content, image_ids]
              properties:
                title: {type: string, minLength: 1, maxLength: 80}
                content: {type: string, minLength: 1, maxLength: 2000}
                image_ids:
                  type: array
                  maxItems: 4
                  uniqueItems: true
                  items: {type: string, format: uuid}
                novel_id: {type: string, format: uuid, nullable: true}
      responses:
        '200':
          description: 已固定的私密预览
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostPreview'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: UUID 复用、缺笔名、预览额度耗尽、图片不可用或关联长文不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410': {$ref: '#/components/responses/PreviewExpired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: readMyShortPostPreview
      tags: [短内容]
      summary: 读取本人固定预览
      responses:
        '200':
          description: 已固定的私密预览
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortPostPreview'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/PreviewExpired'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/my/short-post-images/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: 作者生成的非零上传 UUID，按登录账号隔离
        schema: {type: string, format: uuid}
    put:
      operationId: stageShortPostImage
      tags: [短内容]
      summary: 上传本人短帖暂存图片
