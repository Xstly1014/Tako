  /api/search:
    get:
      operationId: searchPublicWorks
      summary: 按标题、笔名或简介搜索当前公开中篇
      description: 字面连续包含匹配，英文大小写不敏感；按首次正式发布时间与ID倒序，每页12条。仅当前可读展示版；不检索正文、历史版、评论或私稿。游标绑定规范化关键词，不是结果快照。
      tags: [阅读]
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 64}
        description: 去除首尾空白后非空，不含控制字符；百分号、下划线等作为普通字符。不得重复参数。
      - name: cursor
        in: query
        schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: 成功；无命中返回空items，无正文、邮箱或总数，访问权限不缓存
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 12
                    items: {$ref: '#/components/schemas/DiscoveryCard'}
                  next_cursor: {type: string, maxLength: 512}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/community:
    get:
      operationId: discoverWorks
      summary: 浏览真实公开作品、人工精选及风格标签
      tags:
      - 阅读
      security: []
      responses:
        '403': {$ref: '#/components/responses/OriginRejected'}
        '200':
          description: 成功；不缓存访问权限与正文
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - featured
                - tags
                - next_cursor
                properties:
                  items:
                    type: array
                    maxItems: 12
                    items:
                      $ref: '#/components/schemas/DiscoveryCard'
                  featured:
                    type: array
                    maxItems: 6
                    items:
                      $ref: '#/components/schemas/DiscoveryCard'
                  tags:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - name
                      - count
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                          minimum: 1
                  next_cursor:
                    type: string
                    maxLength: 512
        '400':
          $ref: '#/components/responses/BadInput'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 最新按 V1 正式发布时间和 ID 倒序，每页 12 条；修订、隐藏恢复不顶帖。精选最多 6 条，撤出后须人工重新选入。卡片来自当前展示正式版，不含正文，不自动截取简介；各分区同一读取快照。
      parameters:
      - name: tag
        in: query
        schema:
          type: string
          enum:
          - ''
          - 幻想
          - 冒险
          - 日常
          - 情感
          - 悬疑
          - 科幻
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
  /api/me/access:
    get:
      operationId: getOwnAccess
