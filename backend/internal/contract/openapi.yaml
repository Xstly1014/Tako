  /api/my/novels/{id}/completion-checks:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: prepareNovelCompletion
      tags:
      - 长文
      summary: 完结核对与指定章整改
      description: PUBLICATION_ENABLED控制；本人按会话归属，ops仅运营白名单。核对24小时有效；确认重验公开/待审指纹，零正式章或普通pending拒绝。完结不可逆，不消费私稿。整改绑定完结书指定章/基准版/未撤销处置修订，每章一个有效授权，一次固定提交。预览24小时，提交后不替换，驳回/撤回需新授权。通过仅更新指定章，不生成新章事件、不顶更新；默认保留处置，revoke_case仅显式撤销关联条，其他限制/作者隐藏不变。原回执不表示现状，未知先GET原命令。运营只读已提交候选，不读未提交私稿。
      responses:
        '200':
          description: 固定核对、明确候选或原操作回执
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovelLifecycleReceipt'
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/NotJSON'
        '429':
          $ref: '#/components/responses/Limited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          $ref: '#/components/responses/PreviewExpired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareNovelCompletion'
