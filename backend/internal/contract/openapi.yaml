  /api/ops/curation:
    get:
      operationId: getCurationSlots
      summary: 查看精选编排及失效位置
      tags:
      - 阅读
      responses:
        '200':
          description: 成功；不缓存访问权限与正文
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - revision
                - slots
                properties:
                  revision:
                    type: integer
                    minimum: 1
                  slots:
                    type: array
                    minItems: 6
                    maxItems: 6
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - slot
                      - work_id
                      - work
                      properties:
                        slot:
                          type: integer
                          minimum: 1
                          maximum: 6
                        work_id:
                          type: string
                          format: uuid
                          nullable: true
                        work:
                          $ref: '#/components/schemas/NullableDiscoveryCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 固定六个可编排位置。work=null 表示空位或资格已失效；不返回旧内容。
    post:
      operationId: changeCurationSlot
      summary: 选择、移动或清空精选位置
      tags:
      - 阅读
      responses:
        '200':
          description: 成功；不缓存访问权限与正文
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - revision
                properties:
                  revision:
                    type: integer
                    minimum: 1
        '400':
          $ref: '#/components/responses/BadInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          description: 资源当前不可公开或不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/NotJSON'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 同作品只占一处，移入已占位置会替换原作品。work_id=null 为清空，expected_work_revision 须为 0。整组编排和候选状态均验证。响应丢失沿用 mutation_id；重放不重新选入已撤出的作品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - mutation_id
              - expected_revision
              - slot
              - work_id
              - expected_work_revision
              properties:
                mutation_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  minimum: 1
                slot:
                  type: integer
                  minimum: 1
                  maximum: 6
                work_id:
                  type: string
                  format: uuid
                  nullable: true
                expected_work_revision:
                  type: integer
                  minimum: 0
  /api/auth/methods:
    get:
      operationId: getAuthMethods
      tags: [身份]
      security: []
      summary: 获取当前启用的登录方式
      responses:
        '403': {$ref: '#/components/responses/OriginRejected'}
        '200':
          description: password 模式关闭验证码登录和发送接口；不表示邮箱已经验证
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode]
                properties:
                  mode: {type: string, enum: [email, password]}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/auth/register:
    post:
      operationId: registerPassword
      tags: [身份]
      security: []
      summary: 自主注册并登录（不验证邮箱）
      description: |
        仅 password 模式可用。邮箱沿用现有大小写规范，不证明邮箱归属，不支持邮件找回。
        重复邮箱返回 account_exists，不覆盖原账号；响应丢失后用所选密码登录确认，不循环重新注册。
        密码原样处理不裁剪，至少 8 个字符且 UTF-8 最多 72 字节；超长注册返回 invalid_password。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: 已创建 HttpOnly 七天会话；不返回密码、邮箱或令牌
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '429': {$ref: '#/components/responses/Limited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/auth/login:
    post:
      operationId: loginPassword
      tags: [身份]
      security: []
      summary: 邮箱密码登录
      description: |
        仅 password 模式可用。邮箱沿用现有大小写规范，不证明邮箱归属，不支持邮件找回。
        未知账号、无密码和错误密码统一返回 invalid_login，不清除已有浏览器会话。
        密码原样处理不裁剪，至少 8 个字符且 UTF-8 最多 72 字节；超长注册返回 invalid_password。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: 已创建 HttpOnly 七天会话；不返回密码、邮箱或令牌
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '429': {$ref: '#/components/responses/Limited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/me/password:
    get:
      operationId: getPasswordStatus
      tags: [身份]
      summary: 查询自己的密码设置状态
      responses:
        '403': {$ref: '#/components/responses/OriginRejected'}
        '200':
          description: 仅返回是否已设置，不返回散列或密码
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured]
                properties:
                  configured: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: setupOwnPassword
      tags: [身份]
      summary: 已登录账号首次设置密码
      description: |
        只作用于会话账号，不能指定邮箱或账号 ID。原账号及数据不变。
        相同密码重试成功，不同密码不能覆盖既有密码（password_already_set）。
        不提供改密或邮件找回。至少 8 个字符且 UTF-8 最多 72 字节，不裁剪空白。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: 密码已设置或相同设置的安全重试}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '429': {$ref: '#/components/responses/Limited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/auth/code:
    post:
      operationId: requestCode
      tags: [身份]
      security: []
      summary: 请求登录验证码
      description: |
        delivery_id 是客户端生成且保留的非零 UUID。超时沿用同一 ID 和邮箱重试，返回现有任务状态，不生成新验证码或消耗新发送额度。
        新的主动重发使用新 ID，并受冷却限制；旧码失效。SMTP 超时可能重复发送同一个验证码，无法保证绝对只发送一次。
        202 表示任务已持久化或返回其当前状态，不表示邮件已送达。可用同一请求查询进展，不要生成新 ID 轮询。
        任务与幂等记录至少保留 24 小时；超过此期限不得重用旧 ID。任务终态不因轮询自动重发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, delivery_id]
              properties:
                email: {type: string, maxLength: 254, example: writer@example.com}
                delivery_id: {type: string, format: uuid, description: 非零 UUID；不是响应 X-Request-ID}
      responses:
        '202':
          description: 已持久化的发送任务及当前状态；幂等重放也返回 202
          content:
            application/json:
              schema:
                type: object
                required: [delivery_id, status, expires_at]
                additionalProperties: false
                properties:
                  delivery_id: {type: string, format: uuid}
                  status: {type: string, enum: [queued, sending, sent, failed, expired]}
                  expires_at: {type: string, format: date-time, description: 验证码有效期不因重试延长；任务 sent 后验证码也可能已经过期}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '429': {$ref: '#/components/responses/Limited'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/auth/verify:
    post:
      operationId: verifyCode
      tags: [身份]
      security: []
      summary: 验证并登录或注册
      description: 验证码一次性消费。响应丢失后不会重发原会话 Cookie，需要重新登录；不得循环重试验证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email: {type: string, maxLength: 254}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: 已登录；Set-Cookie 设置 HttpOnly 会话，生产 Secure
          headers:
            Set-Cookie: {schema: {type: string}, description: 浏览器管理的会话 Cookie}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '429': {$ref: '#/components/responses/Limited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/auth/logout:
    post:
      operationId: logout
      tags: [身份]
      security: []
      summary: 撤销当前会话
      description: 重复退出安全；只撤销服务端会话，不删除本机草稿。数据库失败不虚报成功。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '204': {description: 会话已撤销，清除 Cookie}
        '400': {$ref: '#/components/responses/BadInput'}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/NotJSON'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/me:
    get:
      operationId: getMe
      tags: [身份]
      summary: 当前账号
      responses:
        '403': {$ref: '#/components/responses/OriginRejected'}
        '200':
          description: 账号信息，不返回邮箱或会话令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateNickname
      tags: [身份]
      summary: 设置或修改笔名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname]
              properties:
                nickname: {type: string, minLength: 1, maxLength: 64, description: 去除首尾空白后校验，允许重名}
      responses:
        '200':
          description: 更新后的账号
          content:
