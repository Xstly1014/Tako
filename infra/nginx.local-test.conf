log_format tako_safe escape=json '{"status":$status,"upstream_status":"$upstream_status","duration":"$request_time","request_id":"$upstream_http_x_request_id"}';
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream tako_api { zone tako_api 64k; server api:8080 resolve; }
upstream tako_web { zone tako_web 64k; server web:3000 resolve; }
server {
    listen 3300;
    server_name 127.0.0.1;
    access_log /dev/stdout tako_safe;
    error_log /dev/null;
    # Cookie hosts and browser storage must remain distinct from localhost ECS forwarding.
    if ($host != 127.0.0.1) { return 421; }
    client_max_body_size 0;
    location ~ ^/(api|docs|openapi\.json|health)(/|$) {
        proxy_pass http://tako_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://tako_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
}
