name: tako-local-test
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: tako_sandbox
      MYSQL_USER: tako_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?test configuration required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?test configuration required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.runtime/local-test/init-test.sql:/docker-entrypoint-initdb.d/001-test-identity.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--innodb-buffer-pool-size=256M", "--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    image: writing-community-api:${APP_VERSION:-local}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      HTTP_ADDR: :8080
      APP_ORIGIN: http://127.0.0.1:3300
      APP_ENVIRONMENT: test
      SESSION_COOKIE_NAME: tako_test_session
      AUTH_MODE: password
      AUTH_PEPPER: ${AUTH_PEPPER:?required}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?required}
      COOKIE_SECURE: "false"
      API_ENABLE_DOCS: "true"
      PUBLICATION_ENABLED: "true"
      OPERATOR_ACCOUNT_IDS: ${OPERATOR_ACCOUNT_IDS:?required}
      MYSQL_DSN: tako_test:${MYSQL_PASSWORD}@tcp(mysql:3306)/tako_sandbox?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27&timeout=5s&readTimeout=5s&writeTimeout=5s
      GOMEMLIMIT: 144MiB
    depends_on:
      mysql: {condition: service_healthy}
  web:
    image: writing-community-web:${APP_VERSION:-local}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NUXT_PUBLIC_PUBLICATION_ENABLED: "true"
      NUXT_PUBLIC_ENVIRONMENT: test
      NUXT_PUBLICATION_API_BASE: http://api:8080
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: ["127.0.0.1:3300:3300"]
    volumes: [./infra/nginx.local-test.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api, web]
  tools:
    image: golang:1.26
    profiles: [tools]
    working_dir: /src
    volumes:
      - ./backend:/src
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      APP_ENVIRONMENT: test
      MYSQL_DSN: tako_test:${MYSQL_PASSWORD}@tcp(mysql:3306)/tako_sandbox?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: tako_test:${MYSQL_PASSWORD}@tcp(mysql:3306)/tako_sandbox?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27&multiStatements=true
      TEST_DATASET_ID: ${TEST_DATASET_ID:?required}
      TEST_OPERATOR_PASSWORD: ${TEST_OPERATOR_PASSWORD:?required}
      TEST_AUTHOR_PASSWORD: ${TEST_AUTHOR_PASSWORD:?required}
      TEST_READER_PASSWORD: ${TEST_READER_PASSWORD:?required}
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  mysql_data:
  go_modules: {external: true, name: writing-community_go_modules}
  go_build: {external: true, name: writing-community_go_build}
