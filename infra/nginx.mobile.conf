# Proxy logs contain only safe outcome fields; request URI/query/headers are omitted.
log_format tako_safe escape=json '{"status":$status,"upstream_status":"$upstream_status","duration":"$request_time","request_id":"$upstream_http_x_request_id"}';
server {
    access_log /dev/stdout tako_safe;
    error_log /dev/null;
    listen 80;
    server_name _;
    location = /tako-dev-ca.cer {
        alias /certs/dev-ca.cer;
        default_type application/x-x509-ca-cert;
        add_header Cache-Control no-store;
    }
    location / { return 404; }
}
server {
    access_log /dev/stdout tako_safe;
    error_log /dev/null;
    listen 443 ssl;
    server_name _;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    location /docs { return 404; }
    location /openapi.json { return 404; }
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://mobile-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
