<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tako · 全页面设计评审</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="review"><h1>Tako 页面规划</h1><p>前端设计稿 · 合成数据<br>不连接账号、支付或业务接口。请勿填写真实信息。</p><label>查找页面<input id="catalog-search" placeholder="输入页面名称"></label><div id="catalog"></div></aside>
<div class="stage"><div class="toolbar"><label>查看状态<select id="state"><option value="ready">正常</option><option value="loading">加载中</option><option value="empty">空内容</option><option value="error">读取失败</option><option value="guest">未登录</option><option value="denied">不可访问</option><option value="offline">离线</option><option value="uncertain">提交未确认</option></select></label><label>屏宽<select id="size"><option>390</option><option>360</option><option>430</option></select></label><span id="coverage"></span></div><div class="phone"><div class="prototype-note">界面原型 · 所有操作仅在本页演示</div><header id="header"></header><main id="page"></main><nav id="bottom" aria-label="主导航"></nav><div id="overlay" hidden></div><div id="toast" role="status" hidden></div></div><p id="page-note"></p></div><script src="app.js"></script></body></html>
